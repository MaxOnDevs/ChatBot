<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>The Record Buddy | Chatbot demo</title>
    <link rel="stylesheet" href="/static/style_new.css">

</head>
<body class="demo">

    <main class="chat-container">

        <header>
            <h1>The Record Buddy - Chatbot demo</h1>
            <p>il miglior compagno per trovare i suoni giusti</p>
        </header>

        <section id="messages"></section>

        <form id="chat-form">
            <input
                id="message"
                type="text"
                placeholder="Scrivi una domanda..."
                required
            >
            <button type="submit">Invia</button>
        </form>

    </main>

    <script src="/static/app.js"></script>
</body>
</html>
